<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="fysetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0950c3" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="fysetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0950c3" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Shape -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#fysetGradient)" filter="url(#dropShadow)" />
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#fysetGlow)" />

  <!-- Code Brackets & Flow Symbol -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Bracket < -->
    <path d="M 180 180 L 116 256 L 180 332" stroke-width="36" />
    <!-- Right Bracket > -->
    <path d="M 332 180 L 396 256 L 332 332" stroke-width="36" />
    <!-- Forward Slash / -->
    <path d="M 284 156 L 228 356" stroke-width="32" opacity="0.9" />
  </g>

  <!-- Accent Sparkle -->
  <circle cx="396" cy="136" r="20" fill="#f59e0b" />
</svg>
